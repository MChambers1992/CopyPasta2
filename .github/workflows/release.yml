name: Package and Release

on:
  push:
    branches: [ develop ]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Clone project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The packager skips a branch push whose HEAD is already tagged, expecting the tag push to start its own run.
      # Tags pushed with the workflow token start no workflows, so the Publish Release workflow is started explicitly,
      # on the tag. That run is a dispatch, so the packager publishes the tagged HEAD as a release instead of skipping it.
      - name: Push release tag and start publishing
        run: |
          set -euo pipefail
          TAG="release-${GITHUB_RUN_NUMBER}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, reusing it"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Automated release $TAG"
            git push origin "refs/tags/$TAG"
          fi
          gh workflow run publish.yml --ref "$TAG"
