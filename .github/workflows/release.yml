name: Package and Release

on:
  push:
    branches: [ develop ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The packager publishes a tagged HEAD as a release; an untagged HEAD would upload as an alpha.
      - name: Push release tag
        run: |
          set -euo pipefail
          TAG="release-${GITHUB_RUN_NUMBER}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, reusing it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automated release $TAG"
          git push origin "refs/tags/$TAG"

      # Uploads one zip to CurseForge, tagged with every interface version in the TOC, and to GitHub Releases.
      - name: Package and upload
        uses: BigWigsMods/packager@v2
