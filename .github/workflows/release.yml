name: Package and Release

on:
  push:
    branches: [ develop ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Package for develop artifacts
        id: package_develop
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Resolve version from package output
        id: package_meta
        run: |
          set -euo pipefail
          ZIP_PATH=$(ls -1 .release/*.zip | head -n1)
          ZIP_NAME=$(basename "$ZIP_PATH" .zip)
          VERSION=${ZIP_NAME#CopyPasta2-}
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish zip to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.package_meta.outputs.version }}
          name: CopyPasta2-Release-${{ steps.package_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.package_meta.outputs.zip_path }}
          fail_on_unmatched_files: true
          prerelease: false
